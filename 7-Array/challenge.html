<script>

/*
    Array Challenge
*/

let zero = 0;

let counter = 3;

let my = ["Ahmed", "Mazero", "Elham", "Osama", "Gamal", "Ameer"];

// Write Code Here

console.log(my.slice(zero,++counter).reverse()); // ["Osama", "Elham", "Mazero", "Ahmed"];

counter--;

console.log(my.slice(++zero,counter).reverse()); // ["Elham", "Mazero"]

console.log("El"+my[zero].slice(2)); // "Elzero"

console.log( my[zero].slice(-2,-1) + my[zero].slice(-1).toUpperCase() ); // "rO"
</script>
